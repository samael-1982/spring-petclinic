replicaCount: 1
image:
  repository: ghcr.io/samael-1982/spring-petclinic
  tag: "24-55097ee"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  host: petclinic.local
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: petclinic-local-tls
  annotations:
    cert-manager.io/cluster-issuer: local-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
postgres:
  url: jdbc:postgresql://postgres-postgresql.database.svc.cluster.local:5432/petclinic
  username: petclinic
  password: petclinic
env:
  springProfilesActive: postgres
resources: {}
probes:
  liveness:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
