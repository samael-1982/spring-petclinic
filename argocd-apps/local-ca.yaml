apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-ca
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:samael-1982/spring-petclinic.git
    targetRevision: main
    path: charts/local-ca

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
