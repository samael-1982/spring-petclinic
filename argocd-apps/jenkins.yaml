apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.7.17
    helm:
      values: |
        controller:
          image:
            registry: docker.io
            repository: jenkins/jenkins
            tag: "2.504.3-jdk17"
          serviceType: ClusterIP
          ingress:
            enabled: true
            ingressClassName: nginx
            hostName: jenkins.local
            annotations:
              cert-manager.io/cluster-issuer: local-ca
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            tls:
              - secretName: jenkins-local-tls
                hosts:
                  - jenkins.local

          admin:
            username: admin
            password: admin1234          
          installPlugins:
            - kubernetes
            - workflow-aggregator
            - git
            - credentials
            - plain-credentials
            - credentials-binding
            - docker-workflow
            - ssh-agent
            - configuration-as-code
            - job-dsl
            - kubernetes
          javaOpts: "-Djenkins.install.runSetupWizard=false"
        persistence:
          enabled: false



  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
